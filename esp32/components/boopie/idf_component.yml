# LVGL for font/boopie_font.c, on the boards with Muse's UI (the same rule as
# components/muse/idf_component.yml, so both get the same LVGL).
dependencies:
  lvgl/lvgl:
    version: "9.5.0"
    public: true
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} != \"none\""
  # The user data partition's filesystem (store/boopie_store.c): power-loss
  # safe, with wear levelling.
  joltwallet/littlefs: "~1.22"
